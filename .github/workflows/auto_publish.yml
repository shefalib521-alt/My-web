name: Auto Article Publisher Engine

on:
  schedule:
    # প্রতিদিন বাংলাদেশ সময় সকাল ৮টা ও রাত ৮টায় অটোমেটিক রান হবে
    - cron: '0 2,14 * * *'
  workflow_dispatch: # গিটহাব থেকে ম্যানুয়ালি রান করার অপশন

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz

      - name: Run Publisher Script
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_OWNER: ${{ secrets.GH_OWNER }}
          GH_REPO: ${{ secrets.GH_REPO }}
          GROQ_API_KEY: ${{ secrets.GROQ_KEY }}
        run: python main.py
        
